<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DK Official</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #4f46e5);
      color: white;
      min-height: 100vh;
      text-align: center;
      padding: 30px 15px;
    }

    .card {
      max-width: 500px;
      margin: auto;
      padding: 30px 20px;
      background: rgba(255,255,255,0.10);
      border-radius: 25px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .profile {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid white;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    .bio {
      font-size: 18px;
      margin-bottom: 30px;
      opacity: 0.9;
    }

    h2 {
      margin-bottom: 20px;
    }

    a {
      display: block;
      text-decoration: none;
      color: white;
      padding: 18px;
      margin: 15px 0;
      border-radius: 18px;
      font-size: 22px;
    }

    .instagram {
      background: #e1306c;
    }

    .youtube {
      background: red;
    }

    .contact {
      background: rgba(255,255,255,0.20);
    }

    footer {
      margin-top: 40px;
      font-size: 16px;
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <div class="card">

    <img src="photo.jpg" class="profile" alt="DK Official">

    <h1>DK Official</h1>

    <p class="bio">
      Welcome to my official website ❤️
    </p>

    <h2>About Me</h2>

    <p class="bio">
      Hi, I'm DK 👋<br>
      Welcome to my official website.<br>
      Follow me on Instagram and YouTube ❤️
    </p>

    <h2>My Social Media</h2>

    <a class="instagram"
       href="https://www.instagram.com/dk_official_1204_koli"
       target="_blank">
      📸 Instagram
    </a>

    <a class="youtube"
       href="https://www.youtube.com/@dk_official_1204_koli"
       target="_blank">
      ▶️ YouTube
    </a>

    <a class="contact"
       href="mailto:dichencharaniya45@gmail.com">
      ✉️ Contact Me
    </a>

    <footer>
      © 2026 DK Official ❤️
    </footer>

  </div>

</body>
</html>
